name: Extract plutobook binaries

on: [push, pull_request]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/plutoprint/plutobook-manylinux_2_28_x86_64:latest
      
    steps:
      - name: Bundle library and dependencies
        run: |
          dnf -y install patchelf pax-utils binutils

          mkdir -p /bundle/plutobook/lib /bundle/plutobook/include /bundle/plutobook/tools
          cp -a /usr/lib64/libplutobook.so* /bundle/plutobook/lib/
          cp -r /usr/include/plutobook* /bundle/plutobook/include/
          cp /usr/bin/html2pdf /usr/bin/html2png /bundle/plutobook/tools/

          # auditwheel manylinux_2_28 lib_whitelist + the dynamic linker
          WHITELIST="libGL.so.1 libICE.so.6 libSM.so.6 libX11.so.6 libXext.so.6
            libXrender.so.1 libanl.so.1 libatomic.so.1 libc.so.6 libdl.so.2
            libexpat.so.1 libgcc_s.so.1 libglib-2.0.so.0 libgobject-2.0.so.0
            libgthread-2.0.so.0 libm.so.6 libmvec.so.1 libnsl.so.1 libpthread.so.0
            libresolv.so.2 librt.so.1 libstdc++.so.6 libutil.so.1 libz.so.1
            ld-linux-x86-64.so.2"

          is_whitelisted() {
            for w in $WHITELIST; do
              [ "$(basename "$1")" = "$w" ] && return 0
            done
            return 1
          }

          libraries=$(
            { lddtree -l /usr/lib64/libplutobook.so
              lddtree -l /usr/bin/html2pdf
              lddtree -l /usr/bin/html2png
            } | grep '^/' | sort -u | grep -v '/libplutobook\.so' \
              | grep -v '/html2pdf$' | grep -v '/html2png$'
          )

          for lib in $libraries; do
            is_whitelisted "$lib" && { echo "skip (whitelisted): $lib"; continue; }
            cp -v "$lib" /bundle/plutobook/lib/
            patchelf --set-rpath '$ORIGIN' "/bundle/plutobook/lib/$(basename "$lib")"
            strip --strip-unneeded "/bundle/plutobook/lib/$(basename "$lib")"
          done

          patchelf --set-rpath '$ORIGIN' /bundle/plutobook/lib/libplutobook.so
          strip --strip-unneeded /bundle/plutobook/lib/libplutobook.so

          for tool in html2pdf html2png; do
            patchelf --set-rpath '$ORIGIN/../lib' /bundle/plutobook/tools/$tool
            strip --strip-unneeded /bundle/plutobook/tools/$tool
          done

          tar -czvf plutobook-manylinux_2_28-x86_64.tar.gz -C /bundle plutobook

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-manylinux_2_28-x86_64
          path: plutobook-manylinux_2_28-x86_64.tar.gz
